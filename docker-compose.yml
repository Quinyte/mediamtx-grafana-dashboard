name: mediamtx-grafana-demo

# Image versions are PINNED, not :latest. This stack is a demo people clone to
# see the dashboard work; a floating tag means it silently breaks for them on
# some future upstream release. Every pin below was verified end-to-end
# (all 14 data panels populating with live data) on 2026-08-31.
# To upgrade: bump a pin, re-run the stack, re-check the panels, commit.

services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    container_name: mediamtx
    restart: unless-stopped
    volumes:
      # Enables metrics AND grants the `metrics` auth action to non-localhost
      # scrapers (Prometheus). See the comments in mediamtx.yml.
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC (WHIP/WHEP)
      - "8890:8890/udp" # SRT
      - "9998:9998"   # Prometheus metrics

  # Generates a synthetic RTSP stream so the dashboard has live data out of the box.
  # Remove this service when pointing at a real MediaMTX deployment.
  publisher:
    image: linuxserver/ffmpeg:9.0-cli-ls79
    container_name: mediamtx-publisher
    restart: unless-stopped
    depends_on:
      - mediamtx
    # linuxserver/ffmpeg's entrypoint is ffmpeg, so args are passed directly.
    command: >
      -re -f lavfi -i testsrc=size=1280x720:rate=30
      -f lavfi -i sine=frequency=440
      -c:v libx264 -preset veryfast -tune zerolatency -b:v 2M
      -c:a aac -f rtsp rtsp://mediamtx:8554/demo

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: mediamtx-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - mediamtx

  grafana:
    image: grafana/grafana:13.2.0
    container_name: mediamtx-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    ports:
      # Grafana's default 3000 collides with common dev servers (Next.js, etc.);
      # expose on 3300 to stay clear of the 3000-3010 range.
      - "3300:3000"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/mediamtx.json:ro
    depends_on:
      - prometheus
